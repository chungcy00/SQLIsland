<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2 预览：底部面板 / 弹窗 / 展开收起</title>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url("../../resources/ASSETS/fonts/IBMPlexSans-Regular.subset.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;src:url("../../resources/ASSETS/fonts/IBMPlexSans-SemiBold.subset.woff2") format("woff2")}
:root{--bg:#F2F6F8;--card:#fff;--lake:#E2ECF2;--line:#CFE0EA;--ctl:#7E98A9;--ink:#17293A;--ink2:#4F6272;--primary:#38607F;--primary-press:#2E5069;--err:#A33F35;--err-bg:#FBEAE6;--inset:16px;
--sans:"IBM Plex Sans",Roboto,"Noto Sans CJK SC","PingFang SC",system-ui,sans-serif}
@media(max-width:359px){:root{--inset:12px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:24px var(--inset) 80px}
h1{font-size:22px;line-height:1.3;font-weight:600;margin:0 0 4px}
h2{font-size:17px;line-height:1.4;font-weight:600;margin:24px 0 12px}
p{margin:0}.aux{font-size:13px;color:var(--ink2);line-height:1.5}
button{font:inherit;color:inherit}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--primary);color:#fff;font-weight:600;width:100%}
.btn:active{background:var(--primary-press)}
.btn.sec{background:#fff;color:var(--primary);border:1px solid var(--ctl)}.btn.sec:active{background:var(--lake)}
.btn.danger{background:var(--err-bg);color:var(--err)}
.btn.text{background:none;color:var(--primary);min-height:44px;width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
/* 展开收起 §4.8 */
.fold-head{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;padding:0;text-align:left}
.fold-head b{font-weight:600;display:block}.fold-head small{display:block;color:var(--ink2);font-size:13px;line-height:1.5}
.chev{width:24px;height:24px;flex:none;stroke:var(--primary);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease-in-out}
.fold[data-open="true"] .chev{transform:rotate(180deg)}
.fold-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease-in-out}
.fold[data-open="true"] .fold-body{grid-template-rows:1fr}
.fold-body>div{overflow:hidden}.fold-body .in{padding-top:8px}
/* 遮罩 / 面板 §4.6 */
.scrim{position:fixed;inset:0;background:rgba(23,41,58,.4);opacity:0;pointer-events:none;transition:opacity .18s ease-in;z-index:50}
.scrim.on{opacity:1;pointer-events:auto;transition:opacity .22s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:85vh;display:flex;flex-direction:column;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(23,41,58,.16);transform:translateY(105%);transition:transform .18s ease-in;z-index:51;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0);transition:transform .22s ease-out}
.sheet.drag{transition:none}
.grab{height:20px;display:flex;justify-content:center;align-items:center;touch-action:none;flex:none}
.grab i{width:36px;height:4px;border-radius:2px;background:var(--line)}
.sheet-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 var(--inset);flex:none}
.sheet-head h3{margin:0;font-size:17px;font-weight:600}
.x{width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.x svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.75;stroke-linecap:round}
.sheet-list{overflow:auto;padding:0 var(--inset) 8px}
.opt{width:100%;height:56px;display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-top:1px solid var(--line);padding:0;text-align:left}
.opt:first-child{border-top:0}
.opt[aria-checked="true"]{color:var(--primary);font-weight:600}
.opt svg{width:24px;height:24px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.opt[aria-checked="true"] svg{visibility:visible}
/* 弹窗 §4.7 */
.dialog{position:fixed;left:50%;top:50%;width:min(calc(100vw - 48px),320px);transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(23,41,58,.2);padding:20px 16px 16px;z-index:61;transition:opacity .18s ease-in,transform .18s ease-in}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);transition:opacity .22s ease-out,transform .22s ease-out}
.dialog h3{margin:0 0 4px;font-size:17px;line-height:1.4;font-weight:600}
.dialog p{font-size:15px;line-height:1.65}
.dialog .acts{display:flex;gap:8px;margin-top:16px}.dialog .acts .btn{flex:1;min-width:0;padding:0 8px}
#scrim2{z-index:60}
#log{margin-top:12px;font-size:13px;color:var(--ink2);min-height:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>B2 预览 · 面板 / 弹窗 / 展开</h1>
  <p class="aux">仅手机宽度。静态示意，不代表正式代码。点按钮体验；Esc 键 = Android 返回键。</p>

  <h2>底部弹出面板（选择类交互）</h2>
  <div class="card"><button class="btn sec" id="openSheet">选择数据库 · 电商订单 ▾</button>
  <p class="aux" style="margin-top:8px">关闭方式：拖拽条下拉、点遮罩、Esc（返回键）、右上关闭。滑入 220ms / 退出 180ms。</p></div>

  <h2>确认弹窗（仅不可逆操作）</h2>
  <div class="card"><div class="row"><button class="btn sec" id="openDel">删除个人闪卡</button><button class="btn sec" id="openRestore">覆盖恢复记录</button></div>
  <p class="aux" style="margin-top:8px">点遮罩不关闭；Esc（返回键）= 取消。</p><div id="log" role="status"></div></div>

  <h2>展开收起</h2>
  <div class="card"><div class="fold" id="fold" data-open="false">
    <button class="fold-head" aria-expanded="false"><span><b>扩展示例</b><small>NULL 与空字符串的差别（点击展开）</small></span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="fold-body"><div><div class="in"><p>展开 200ms，页面位置不跳；系统开启“减少动画”时直接切换。</p></div></div></div></div></div>

  <h2>正文字号（设置·“显示”分组）</h2>
  <div class="card"><div class="row" role="radiogroup" aria-label="正文字号">
    <button class="btn" data-fs="15" role="radio" aria-checked="true">标准 15</button><button class="btn sec" data-fs="17" role="radio" aria-checked="false">大 17</button></div>
  <p id="fsdemo" style="margin-top:12px">示例正文：WHERE 子句在分组之前筛选行。</p></div>
</main>

<div class="scrim" id="scrim1"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st" aria-hidden="true">
  <div class="grab" id="grab"><i></i></div>
  <div class="sheet-head"><h3 id="st">选择数据库</h3><button class="x" id="closeSheet" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-list" role="radiogroup">
    <button class="opt" role="radio" aria-checked="true">电商订单<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="opt" role="radio" aria-checked="false">用户行为<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="opt" role="radio" aria-checked="false">金融交易<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="opt" role="radio" aria-checked="false">人力资源<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
</div>

<div class="scrim" id="scrim2"></div>
<div class="dialog" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd" aria-hidden="true">
  <h3 id="dt"></h3><p id="dd"></p>
  <div class="acts"><button class="btn sec" id="dcancel">取消</button><button class="btn" id="dok"></button></div>
</div>

<script>
const $=s=>document.querySelector(s),log=m=>$("#log").textContent=m;
let layer=null; // 当前最上层：返回键只关最上层
const sheet=$("#sheet"),s1=$("#scrim1"),dlg=$("#dlg"),s2=$("#scrim2");
function openSheet(){sheet.classList.add("on");s1.classList.add("on");sheet.setAttribute("aria-hidden","false");layer="sheet"}
function closeSheet(){sheet.style.transform="";sheet.classList.remove("on","drag");s1.classList.remove("on");sheet.setAttribute("aria-hidden","true");layer=null}
$("#openSheet").onclick=openSheet;$("#closeSheet").onclick=closeSheet;s1.onclick=closeSheet;
sheet.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sheet.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-checked","false"));b.setAttribute("aria-checked","true");$("#openSheet").textContent="选择数据库 · "+b.firstChild.textContent+" ▾";setTimeout(closeSheet,120)});
// 拖拽条/标题行下滑关闭
let y0=null;const drag=$("#grab");
drag.addEventListener("pointerdown",e=>{y0=e.clientY;sheet.classList.add("drag");drag.setPointerCapture(e.pointerId)});
drag.addEventListener("pointermove",e=>{if(y0!==null)sheet.style.transform=`translateY(${Math.max(0,e.clientY-y0)}px)`});
const end=e=>{if(y0===null)return;const d=e.clientY-y0;y0=null;sheet.classList.remove("drag");sheet.style.transform="";if(d>80)closeSheet()};
drag.addEventListener("pointerup",end);drag.addEventListener("pointercancel",end);
function ask(t,d,ok,danger){$("#dt").textContent=t;$("#dd").textContent=d;const b=$("#dok");b.textContent=ok;b.className="btn"+(danger?" danger":"");dlg.classList.add("on");s2.classList.add("on");dlg.setAttribute("aria-hidden","false");layer="dialog";b.focus?.()}
function closeDlg(){dlg.classList.remove("on");s2.classList.remove("on");dlg.setAttribute("aria-hidden","true");layer=null}
$("#openDel").onclick=()=>ask("删除这张个人闪卡？","会同时删除它的复习计划，删除后无法撤销。","删除",true);
$("#openRestore").onclick=()=>ask("覆盖当前学习记录？","个人数据集按 ID 合并。覆盖后无法撤销，请先导出当前备份。","覆盖",true);
$("#dcancel").onclick=()=>{closeDlg();log("已取消，未执行任何操作")};
$("#dok").onclick=()=>{closeDlg();log("已确认执行："+$("#dok").textContent)};
s2.onclick=()=>{/* 点遮罩不关闭 */};
addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(layer==="dialog"){closeDlg();log("返回键 = 取消")}else if(layer==="sheet")closeSheet()});
const f=$("#fold"),fh=f.querySelector(".fold-head");fh.onclick=()=>{const o=f.dataset.open!=="true";f.dataset.open=o;fh.setAttribute("aria-expanded",o)};
document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-fs]").forEach(x=>{const on=x===b;x.className="btn"+(on?"":" sec");x.setAttribute("aria-checked",on)});$("#fsdemo").style.fontSize=b.dataset.fs+"px"});
</script>
</body>
</html>
