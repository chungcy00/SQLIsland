<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数屿SQL · 首页预览</title>
<link rel="stylesheet" href="base.css">
<style>
  body { padding-bottom: 104px; }
  .top { padding: 12px var(--inset) 4px; display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
  .brand small { display: block; margin-top: 2px; }
  main { padding: 0 var(--inset); }
  section { margin-top: 24px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; }

  /* 主卡 */
  .hero { position: relative; overflow: hidden; border-radius: 16px; background: var(--lake); border: 1px solid var(--line); padding: 16px; min-height: 212px; margin-top: 8px; }
  .hero .contour { position: absolute; right: 0; top: 0; height: 100%; width: 62%; color: var(--primary); opacity: .15; pointer-events: none; }
  .hero .island { position: absolute; right: -10px; bottom: 4px; width: 150px; height: 150px; }
  .hero .txt { position: relative; max-width: 66%; }
  .hero .tag { background: #fff; }
  .hero .eyebrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .hero h2 { font-size: 22px; line-height: 1.3; font-weight: 600; }
  .hero .meta { margin-top: 4px; }
  .hero .prog { margin-top: 16px; display: flex; align-items: center; gap: 8px; max-width: 62%; }
  .hero .prog .bar { flex: 1; background: #fff; }
  .hero .btn { margin-top: 16px; position: relative; }

  @media (max-width: 359px) { .hero .island { width: 112px; height: 112px; right: -8px; bottom: 56px; } .hero .prog { max-width: 56%; } .hero .txt { max-width: 70%; } }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mini { padding: 16px; display: flex; flex-direction: column; gap: 4px; min-height: 124px; }
  .mini .num { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .mini .num small { font-size: 13px; font-weight: 400; color: var(--ink2); margin-left: 4px; }
  .mini .go { margin-top: auto; display: flex; align-items: center; gap: 4px; color: var(--primary); font-weight: 600; font-size: 14px; }
  .mini .head { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 13px; font-weight: 600; }
  .mini .head .ico { color: var(--primary); width: 22px; height: 22px; }

  .rows { overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 60px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .body { flex: 1; min-width: 0; }
  .row .ttl { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .row .ico.lead { color: var(--primary); }
  .row .chev { color: var(--ctl); width: 20px; height: 20px; }
  .rows.compact .row { min-height: 64px; padding-top: 8px; padding-bottom: 8px; }
  .row .barline { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row .barline .bar { flex: 1; }
  .row .barline span { font-size: 12px; color: var(--ink2); min-width: 28px; text-align: right; }
  .done-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); display: inline-block; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="t-page">数屿 SQL</div>
    <small class="t-aux">数据分析面试 · 离线 SQL 训练</small>
  </div>
  <button class="ibtn" aria-label="搜索"><i data-i="search"></i></button>
</header>

<main>
  <!-- 主卡：继续学习 -->
  <article class="hero" aria-label="继续学习">
    <svg class="contour" viewBox="0 0 200 220" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.25">
      <g transform="translate(150 118)">
        <path d="M-95 6C-95-30-55-62-8-60 42-58 78-30 74 8 70 44 34 70-12 68-62 66-95 42-95 6Z" transform="scale(.55)"/>
        <path d="M-95 6C-95-30-55-62-8-60 42-58 78-30 74 8 70 44 34 70-12 68-62 66-95 42-95 6Z" transform="scale(.85)"/>
        <path d="M-95 6C-95-30-55-62-8-60 42-58 78-30 74 8 70 44 34 70-12 68-62 66-95 42-95 6Z" transform="scale(1.2)"/>
        <path d="M-95 6C-95-30-55-62-8-60 42-58 78-30 74 8 70 44 34 70-12 68-62 66-95 42-95 6Z" transform="scale(1.6)"/>
        <path d="M-95 6C-95-30-55-62-8-60 42-58 78-30 74 8 70 44 34 70-12 68-62 66-95 42-95 6Z" transform="scale(2.05)"/>
      </g>
    </svg>

    <!-- 数据岛：4×3 表格地块，亮起数量对应已学知识点（预览：已学 23/80 ≈ 3.4 块） -->
    <svg class="island" viewBox="0 0 160 160" role="img" aria-label="数据岛：已点亮 3 块地块，共 12 块">
      <g fill="none" stroke="#CFE0EA" stroke-width="1.5">
        <path opacity=".35" transform="translate(80 92) scale(1.26) translate(-80 -92)" d="M22 92C20 74 38 60 60 57 72 55 80 47 98 50 120 53 141 66 145 86 148 100 138 111 123 116 110 121 104 133 86 132 70 131 62 124 47 122 31 119 24 106 22 92Z"/>
        <path opacity=".6" transform="translate(80 92) scale(1.12) translate(-80 -92)" d="M22 92C20 74 38 60 60 57 72 55 80 47 98 50 120 53 141 66 145 86 148 100 138 111 123 116 110 121 104 133 86 132 70 131 62 124 47 122 31 119 24 106 22 92Z"/>
      </g>
      <path d="M22 92C20 74 38 60 60 57 72 55 80 47 98 50 120 53 141 66 145 86 148 100 138 111 123 116 110 121 104 133 86 132 70 131 62 124 47 122 31 119 24 106 22 92Z" transform="translate(0 5)" fill="#BCCFDB"/>
      <path d="M22 92C20 74 38 60 60 57 72 55 80 47 98 50 120 53 141 66 145 86 148 100 138 111 123 116 110 121 104 133 86 132 70 131 62 124 47 122 31 119 24 106 22 92Z" fill="#E4EEF4" stroke="#8FB1C8" stroke-width="1.75" stroke-linejoin="round"/>
      <!-- 地块 -->
      <g transform="translate(80 90) scale(1 .58) rotate(45)" stroke-width="1.4">
        <g id="parcels"></g>
      </g>
      <!-- 日光黄小旗 -->
      <g stroke="#17293A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M99 79V50" fill="none"/>
        <path d="M99 50l17 6.500-17 6.500z" fill="#F0B94D"/>
      </g>
    </svg>

    <div class="txt">
      <div class="eyebrow"><span class="tag">继续学习</span><span class="t-micro">第 5 章 · 第 1 节</span></div>
      <h2>空值判断与三值逻辑</h2>
      <p class="t-aux meta">空值处理 · 约 8 分钟</p>
    </div>
    <div class="prog"><div class="bar" role="progressbar" aria-valuenow="0" aria-valuemax="2"><i style="width:8%"></i></div><span class="t-aux">0/2</span></div>
    <button class="btn">继续学习</button>
  </article>

  <!-- 次卡 -->
  <section aria-label="闪卡与练习">
    <div class="pair">
      <article class="card mini">
        <div class="head"><i data-i="cards"></i>闪卡复习</div>
        <div class="num">12<small>张待复习</small></div>
        <div class="go">开始复习 <i data-i="chev" class="chev" style="width:18px;height:18px"></i></div>
      </article>
      <article class="card mini">
        <div class="head"><i data-i="practice"></i>今日练习</div>
        <div class="num">3<small>题推荐</small></div>
        <div class="go">去练习 <i data-i="chev" class="chev" style="width:18px;height:18px"></i></div>
      </article>
    </div>
  </section>

  <!-- 快捷入口 -->
  <section aria-label="快捷入口">
    <div class="card rows">
      <a class="row" href="#"><i data-i="project" class="lead"></i><div class="body"><div class="ttl">业务实战</div><div class="t-aux">六个业务项目 · 真实场景任务</div></div><i data-i="chev" class="chev"></i></a>
      <a class="row" href="#"><i data-i="flask" class="lead"></i><div class="body"><div class="ttl">代码实验室</div><div class="t-aux">七套数据库 · 自由写 SQL</div></div><i data-i="chev" class="chev"></i></a>
    </div>
  </section>

  <div class="wave" aria-hidden="true"><svg viewBox="0 0 360 12" preserveAspectRatio="none"><path d="M0 7C22 4 41 9 66 6.500S110 3 134 6.500 182 10 210 6 262 3 291 7 338 9 360 5.500" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".8"/></svg></div>

  <!-- 学习路线（紧凑密度） -->
  <section aria-label="学习路线">
    <div class="sec-h"><h3 class="t-sec">学习路线</h3><span class="t-aux">阶段一 · 基础查询</span></div>
    <div class="card rows compact">
      <a class="row" href="#"><span class="badge">01</span><div class="body"><div class="ttl">数据库基础</div><div class="barline"><div class="bar"><i style="width:100%"></i></div><span>3/3</span></div></div><i data-i="chev" class="chev"></i></a>
      <a class="row" href="#"><span class="badge">02</span><div class="body"><div class="ttl">基础查询<span class="done-dot" title="已完成"></span></div><div class="barline"><div class="bar"><i style="width:100%"></i></div><span>2/2</span></div></div><i data-i="chev" class="chev"></i></a>
      <a class="row" href="#"><span class="badge">03</span><div class="body"><div class="ttl">条件筛选</div><div class="barline"><div class="bar"><i style="width:25%"></i></div><span>1/4</span></div></div><i data-i="chev" class="chev"></i></a>
      <a class="row" href="#"><span class="badge">04</span><div class="body"><div class="ttl">排序与分页</div><div class="barline"><div class="bar"><i style="width:0%"></i></div><span>0/2</span></div></div><i data-i="chev" class="chev"></i></a>
    </div>
  </section>

  <p class="t-micro sample-note">预览示例数据：进度与数量为演示，不代表真实学习记录</p>
</main>

<nav class="nav" aria-label="主导航">
  <a class="on" href="home.html"><span class="pill"><i data-i="home"></i></span>首页</a>
  <a href="lesson.html"><span class="pill"><i data-i="learn"></i></span>学习</a>
  <a href="#"><span class="pill"><i data-i="practice"></i></span>练习</a>
  <a href="#"><span class="pill"><i data-i="cards"></i></span>闪卡</a>
  <a href="#"><span class="pill"><i data-i="me"></i></span>我的</a>
</nav>

<script src="icons.js"></script>
<script>
  // 地块：4 列 × 3 行；前 3 块完全点亮，第 4 块半亮（按已学 23/80 比例）
  const g = document.getElementById("parcels");
  const ops = [1, .78, .56, .3];
  let n = 0;
  for (let j = 0; j < 3; j++) for (let i = 0; i < 4; i++) {
    const lit = n < 4;
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("x", -36.5 + i * 19); r.setAttribute("y", -27 + j * 19);
    r.setAttribute("width", 16); r.setAttribute("height", 16); r.setAttribute("rx", 3);
    if (lit) { r.setAttribute("fill", "#38607F"); r.setAttribute("fill-opacity", ops[n]); r.setAttribute("stroke", "#38607F"); }
    else { r.setAttribute("fill", "#F3F8FA"); r.setAttribute("stroke", "#A9C2D2"); }
    g.appendChild(r); n++;
  }
</script>
</body>
</html>
